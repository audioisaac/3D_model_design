document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<style>\n  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--color-bg); }\n  a { color: var(--color-accent-700); }\n  a:hover { color: var(--color-accent-800); }\n  #view { position: fixed; inset: 0; }\n  #view canvas { display: block; touch-action: none; outline: none; }\n  .hud { position: fixed; top: var(--space-6); left: var(--space-6); max-width: 380px; display: flex; flex-direction: column; gap: var(--space-2); pointer-events: none; }\n  .hud h1 { margin: 0; }\n  .hud p { margin: 0; color: var(--color-neutral-700); text-wrap: pretty; }\n  .wx { position: fixed; top: var(--space-6); right: var(--space-6); display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-2); }\n  .wx .seg { background: var(--color-neutral-100); }\n  .wx .seg-opt { white-space: nowrap; }\n  .wx .seg-opt input { position: absolute; opacity: 0; pointer-events: none; }\n  .wx-label { font-size: 12px; color: var(--color-neutral-700); }\n  .bar { position: fixed; left: var(--space-6); right: var(--space-6); bottom: var(--space-6); display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: var(--space-3); pointer-events: none; }\n  .bar > * { pointer-events: auto; }\n  .acts { display: flex; flex-wrap: wrap; gap: var(--space-2); max-width: 900px; }\n  .acts .btn { background: var(--color-neutral-100); }\n  .acts .btn, #glb { white-space: nowrap; flex-shrink: 0; }\n  .acts { flex: 1 1 0; min-width: 0; }\n  .acts .btn:hover { background: var(--color-neutral-200); }\n  .acts .btn:active { background: var(--color-neutral-300); }\n  .tip { position: fixed; left: 0; top: 0; pointer-events: none; padding: var(--space-1) var(--space-3); border-radius: 999px; background: var(--color-text); color: var(--color-bg); font: 500 14px/1.4 var(--font-body); white-space: nowrap; box-shadow: var(--shadow-sm); }\n  .tip[hidden] { display: none; }\n  .hud, .bar, .wx { transition: opacity 0.3s; }\n  body.closeup .hud, body.closeup .bar, body.closeup .wx { opacity: 0; pointer-events: none; }\n  .bd-back { position: fixed; inset: 0; z-index: 9; }\n  .bd { position: fixed; z-index: 10; }\n  .bd[hidden], .bd-back[hidden], .bd-pager[hidden] { display: none; }\n  .bd-bar { position: absolute; left: 0; right: 0; bottom: calc(100% + var(--space-3)); display: flex; align-items: center; gap: var(--space-3); }\n  .bd-title { margin: 0 auto 0 0; font-size: 22px; }\n  .bd-pager { display: flex; align-items: center; gap: var(--space-1); padding: 2px; border-radius: 999px; background: var(--color-neutral-100); font-size: 13px; }\n  .bd-sheet { position: absolute; left: 0; top: 0; width: 760px; height: 560px; transform-origin: 0 0; }\n  .bd-note { position: absolute; width: 200px; height: 190px; border-radius: 14px; }\n  .bd-note:focus-within { outline: 3px solid var(--color-accent); outline-offset: 4px; }\n  .bd-text { position: absolute; left: 18px; top: 36px; width: 170px; height: 138px; padding: 0; border: 0; background: transparent; resize: none; overflow: hidden; outline: none; font: 600 27px/34px var(--font-body); color: var(--color-text); caret-color: var(--color-accent); }\n  .bd-text::placeholder { color: color-mix(in srgb, var(--color-text) 40%, transparent); }\n  .bd-note.done .bd-text { opacity: 0.5; text-decoration: line-through; text-decoration-thickness: 3px; }\n  .bd-check { position: absolute; left: 145px; top: 127px; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; }\n  .bd-check:hover { background: color-mix(in srgb, var(--color-accent-2-600) 14%, transparent); }\n  .bd-check:active { background: color-mix(in srgb, var(--color-accent-2-600) 24%, transparent); }\n  .bd-check:focus-visible, .bd-del:focus-visible, .bd-add:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }\n  .bd-del { position: absolute; right: 6px; top: 6px; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 999px; background: var(--color-neutral-100); color: var(--color-text); cursor: pointer; opacity: 0; box-shadow: var(--shadow-sm); }\n  .bd-note:hover .bd-del, .bd-note:focus-within .bd-del { opacity: 1; }\n  .bd-del:hover { background: var(--color-accent-100); color: var(--color-accent-800); }\n  .bd-del:active { background: var(--color-accent-200); }\n  .bd-del .icon { width: 22px; height: 22px; }\n  .bd-add { position: absolute; width: 200px; height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: 3px dashed color-mix(in srgb, var(--color-text) 35%, transparent); border-radius: 14px; background: transparent; color: var(--color-text); font: 600 24px/1.2 var(--font-body); cursor: pointer; }\n  .bd-add:hover { background: rgba(255, 255, 255, 0.28); }\n  .bd-add:active { background: rgba(255, 255, 255, 0.45); }\n  .bd-add .icon { width: 34px; height: 34px; }\n  .wd { position: fixed; z-index: 10; right: var(--space-6); top: 50%; transform: translateY(-50%); width: min(400px, calc(100vw - 2 * var(--space-6))); max-height: calc(100vh - 2 * var(--space-6)); overflow: auto; display: flex; flex-direction: column; gap: var(--space-4); }\n  .wd[hidden] { display: none; }\n  .wd-title { margin: 0; }\n  .wd-group { margin: 0; padding: 0; border: 0; min-width: 0; }\n  .wd-group legend { padding: 0; margin-bottom: var(--space-2); font-weight: 600; font-size: 14px; color: var(--color-neutral-700); }\n  .wd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--space-2); }\n  .wd-opt { display: flex; align-items: center; gap: var(--space-2); min-height: 48px; padding: 5px 14px 5px 5px; border: 2px solid transparent; border-radius: 999px; background: var(--color-neutral-100); color: var(--color-text); font: 500 15px/1.2 var(--font-body); text-align: left; cursor: pointer; }\n  .wd-opt:hover { background: var(--color-neutral-200); }\n  .wd-opt:active { background: var(--color-neutral-300); }\n  .wd-opt:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n  .wd-opt[aria-pressed=\"true\"] { background: var(--color-accent-2-100); border-color: var(--color-accent-2-600); }\n  .wd-sw { flex: none; width: 34px; height: 34px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(32, 30, 29, 0.14); }\n  @media (max-width: 720px) { .wd { top: auto; bottom: var(--space-4); left: var(--space-4); right: var(--space-4); width: auto; transform: none; max-height: 46vh; } }\n  .mr-human { display: flex; flex-direction: column; gap: var(--space-4); }\n  .mr-human[hidden] { display: none; }\n  .mr-chips, .mr-sws { display: flex; flex-wrap: wrap; gap: var(--space-2); }\n  .mr-chips + .mr-sws { margin-top: var(--space-3); }\n  .mr-chip { min-height: 40px; padding: 8px 16px; border: 2px solid transparent; border-radius: 999px; background: var(--color-neutral-100); color: var(--color-text); font: 500 14px/1.2 var(--font-body); cursor: pointer; }\n  .mr-chip:hover { background: var(--color-neutral-200); }\n  .mr-chip:active { background: var(--color-neutral-300); }\n  .mr-chip[aria-pressed=\"true\"] { background: var(--color-accent-2-100); border-color: var(--color-accent-2-600); }\n  .mr-swb { width: 40px; height: 40px; padding: 0; border: 0; border-radius: 999px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(32, 30, 29, 0.14); }\n  .mr-swb:hover { transform: scale(1.06); }\n  .mr-swb:active { transform: scale(0.96); }\n  .mr-swb[aria-pressed=\"true\"] { box-shadow: 0 0 0 3px var(--color-bg), 0 0 0 5px var(--color-accent-2-600); }\n  .mr-chip:focus-visible, .mr-swb:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }\n  .mr-status { margin: 0; min-height: 1.4em; font-size: 14px; color: var(--color-neutral-700); }\n  .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.75; stroke-linecap: round; stroke-linejoin: round; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"view\" aria-label=\"Character's room, 3D scene\"><\u002Fdiv>\n<header class=\"hud\">\n  <h1 id=\"room-title\">Fox's room<\u002Fh1>\n  <p>Click the floor to walk, or click furniture to use it. Lamps switch on and off. Drag to look around, scroll to zoom.<\u002Fp>\n<\u002Fheader>\n<div class=\"wx\">\n  <div class=\"seg\" role=\"radiogroup\" aria-label=\"Weather\" id=\"wx\">\n    <label class=\"seg-opt\"><input type=\"radio\" name=\"wx\" value=\"sunny\">Sunny<\u002Flabel>\n    <label class=\"seg-opt\"><input type=\"radio\" name=\"wx\" value=\"cloudy\">Cloudy<\u002Flabel>\n    <label class=\"seg-opt\"><input type=\"radio\" name=\"wx\" value=\"rain\">Rain<\u002Flabel>\n    <label class=\"seg-opt\"><input type=\"radio\" name=\"wx\" value=\"storm\">Storm<\u002Flabel>\n    <label class=\"seg-opt\"><input type=\"radio\" name=\"wx\" value=\"snow\">Snow<\u002Flabel>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"bar\">\n  <div class=\"acts\">\n    <button class=\"btn btn-secondary\" data-spot=\"hat\" type=\"button\">Put on the hat<\u002Fbutton>\n    <button class=\"btn btn-secondary\" data-spot=\"wardrobe\" type=\"button\">Open the wardrobe<\u002Fbutton>\n    <button class=\"btn btn-secondary\" data-spot=\"mirror\" type=\"button\">Look in the mirror<\u002Fbutton>\n    <button class=\"btn btn-secondary\" data-spot=\"table\" type=\"button\">Have a cup of tea<\u002Fbutton>\n    <button class=\"btn btn-secondary\" data-spot=\"desk\" type=\"button\">Study at the desk<\u002Fbutton>\n    <button class=\"btn btn-secondary\" data-spot=\"bed\" type=\"button\">Take a nap<\u002Fbutton>\n    <button class=\"btn btn-secondary\" data-spot=\"board\" type=\"button\">Open the to-do board<\u002Fbutton>\n    <button class=\"btn btn-secondary\" data-spot=\"window\" type=\"button\">Look outside<\u002Fbutton>\n  <\u002Fdiv>\n  <button class=\"btn btn-primary\" id=\"glb\" type=\"button\" title=\"Saves the character as currently dressed, with all ten animation clips\">Download GLB<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"tip\" id=\"tip\" hidden=\"\"><\u002Fdiv>\n<aside class=\"wd card elev-lg\" id=\"wd\" hidden=\"\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"wd-title\">\n  <h2 class=\"wd-title\" id=\"wd-title\">Wardrobe<\u002Fh2>\n  <fieldset class=\"wd-group\"><legend>Outfit<\u002Flegend><div class=\"wd-grid\" id=\"wd-outfits\"><\u002Fdiv><\u002Ffieldset>\n  <fieldset class=\"wd-group\"><legend>Headwear<\u002Flegend><div class=\"wd-grid\" id=\"wd-heads\"><\u002Fdiv><\u002Ffieldset>\n  <button class=\"btn btn-primary btn-block\" id=\"wd-done\" type=\"button\">Done<\u002Fbutton>\n<\u002Faside>\n<aside class=\"wd card elev-lg\" id=\"mr\" hidden=\"\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mr-title\">\n  <h2 class=\"wd-title\" id=\"mr-title\">Mirror<\u002Fh2>\n  <fieldset class=\"wd-group\"><legend>Character<\u002Flegend><div class=\"wd-grid\" id=\"mr-species\" data-k=\"species\"><\u002Fdiv><\u002Ffieldset>\n  <div class=\"mr-human\" id=\"mr-human\">\n    <fieldset class=\"wd-group\"><legend>Skin<\u002Flegend><div class=\"mr-sws\" id=\"mr-skin\" data-k=\"skin\"><\u002Fdiv><\u002Ffieldset>\n    <fieldset class=\"wd-group\"><legend>Hair<\u002Flegend><div class=\"mr-chips\" id=\"mr-hair\" data-k=\"hair\"><\u002Fdiv><div class=\"mr-sws\" id=\"mr-hairColor\" data-k=\"hairColor\"><\u002Fdiv><\u002Ffieldset>\n    <fieldset class=\"wd-group\"><legend>Eyes<\u002Flegend><div class=\"mr-chips\" id=\"mr-eyes\" data-k=\"eyes\"><\u002Fdiv><\u002Ffieldset>\n    <fieldset class=\"wd-group\"><legend>Nose<\u002Flegend><div class=\"mr-chips\" id=\"mr-nose\" data-k=\"nose\"><\u002Fdiv><\u002Ffieldset>\n    <fieldset class=\"wd-group\"><legend>Mouth<\u002Flegend><div class=\"mr-chips\" id=\"mr-mouth\" data-k=\"mouth\"><\u002Fdiv><\u002Ffieldset>\n    <fieldset class=\"wd-group\"><legend>Ears<\u002Flegend><div class=\"mr-chips\" id=\"mr-ears\" data-k=\"ears\"><\u002Fdiv><\u002Ffieldset>\n  <\u002Fdiv>\n  <p class=\"mr-status\" id=\"mr-status\" aria-live=\"polite\"><\u002Fp>\n  <button class=\"btn btn-primary btn-block\" id=\"mr-done\" type=\"button\">Done<\u002Fbutton>\n<\u002Faside>\n<div class=\"bd-back\" id=\"bd-back\" hidden=\"\"><\u002Fdiv>\n<div class=\"bd\" id=\"bd\" hidden=\"\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bd-title\">\n  <div class=\"bd-bar\">\n    <h2 class=\"bd-title\" id=\"bd-title\">To-do board<\u002Fh2>\n    <div class=\"bd-pager\" id=\"bd-pager\" hidden=\"\">\n      <button class=\"btn btn-ghost btn-icon\" id=\"bd-prev\" type=\"button\" aria-label=\"Previous page\"><svg class=\"icon\" viewBox=\"0 0 24 24\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <span id=\"bd-page\">1 / 1<\u002Fspan>\n      <button class=\"btn btn-ghost btn-icon\" id=\"bd-next\" type=\"button\" aria-label=\"Next page\"><svg class=\"icon\" viewBox=\"0 0 24 24\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <button class=\"btn btn-primary\" id=\"bd-done\" type=\"button\">Done<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"bd-sheet\" id=\"bd-sheet\"><\u002Fdiv>\n<\u002Fdiv>\n<script type=\"module\">\nimport * as THREE from 'three';\nimport { buildCharacter, SPECIES, HUMAN, normalizeLook } from 'fox-model';\nimport { Reflector } from 'three/addons/objects/Reflector.js';\n\nconst V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);\nconst UP = V(0, 1, 0), TAU = Math.PI * 2;\nconst clamp = (x, a, b) => Math.min(b, Math.max(a, x));\nconst ss = x => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));\nconst backOut = u => 1 + 2.70158 * (u - 1) ** 3 + 1.70158 * (u - 1) ** 2;\nconst wrap = a => Math.atan2(Math.sin(a), Math.cos(a));\nconst store = {\n  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },\n};\n\n// Design-system tokens → three.js colors\nconst rootCss = getComputedStyle(document.documentElement);\nconst cssColor = (name, fallback) => rootCss.getPropertyValue(name).trim() || fallback;\nconst px = document.createElement('canvas').getContext('2d', { willReadFrequently: true });\nfunction toColor(css) {\n  px.fillStyle = '#000'; px.fillStyle = css;\n  px.clearRect(0, 0, 1, 1); px.fillRect(0, 0, 1, 1);\n  const d = px.getImageData(0, 0, 1, 1).data;\n  return new THREE.Color().setRGB(d[0] / 255, d[1] / 255, d[2] / 255, THREE.SRGBColorSpace);\n}\nconst tok = (name, fallback) => toColor(cssColor(name, fallback));\nconst hex = c => '#' + c.getHexString();\nconst mat = (name, color, roughness, extra = {}) => new THREE.MeshStandardMaterial({ name, color, roughness, metalness: 0, ...extra });\n\n// ── Geometry helpers ──\nfunction weld(g) {\n  g.computeVertexNormals();\n  const p = g.attributes.position, n = g.attributes.normal, acc = new Map();\n  const key = i => Math.round(p.getX(i) * 1e5) + ',' + Math.round(p.getY(i) * 1e5) + ',' + Math.round(p.getZ(i) * 1e5);\n  for (let i = 0; i < p.count; i++) { const k = key(i), a = acc.get(k) || V(); acc.set(k, a.add(V(n.getX(i), n.getY(i), n.getZ(i)))); }\n  for (let i = 0; i < p.count; i++) { const a = acc.get(key(i)).clone().normalize(); n.setXYZ(i, a.x, a.y, a.z); }\n  return g;\n}\nconst ell = (rx, ry, rz, w = 32, h = 24) => new THREE.SphereGeometry(1, w, h).scale(rx, ry, rz);\nconst lathe = (pts, segs = 40) => weld(new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), segs));\nfunction rrect(w, h, r) {\n  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;\n  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);\n  s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);\n  s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);\n  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5);\n  return s;\n}\n// Rounded box (w along x, h along y, d along z), centered\nfunction rbox(w, h, d, r = 0.02) {\n  const b = Math.min(r, w * 0.45, h * 0.45, d * 0.45);\n  const iw = w - 2 * b, ih = h - 2 * b, rc = Math.max(0.0008, Math.min(r * 0.6, iw * 0.49, ih * 0.49));\n  const g = new THREE.ExtrudeGeometry(rrect(iw, ih, rc), { depth: Math.max(0.0005, d - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 5, curveSegments: 6 });\n  return g.translate(0, 0, -Math.max(0.0005, d - 2 * b) / 2);\n}\nfunction archShape(w, h, rise) {\n  const s = new THREE.Shape();\n  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, h - rise);\n  s.absellipse(0, h - rise, w / 2, rise, 0, Math.PI, false);\n  s.lineTo(-w / 2, 0);\n  return s;\n}\nconst extrude = (shape, depth, bevel = 0.02) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 5, curveSegments: 24 });\nfunction curtainGeo(w, h, folds = 3, amp = 0.025, thick = 0.012) {\n  const s = new THREE.Shape(), N = 48, f = i => amp * Math.sin(i / N * TAU * folds);\n  s.moveTo(-w / 2, f(0));\n  for (let i = 1; i <= N; i++) s.lineTo(-w / 2 + w * i / N, f(i));\n  for (let i = N; i >= 0; i--) s.lineTo(-w / 2 + w * i / N, f(i) + thick);\n  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 4 });\n  return weld(g.rotateX(Math.PI / 2));\n}\nfunction group(parent, kind, pos = [0, 0, 0], rot = [0, 0, 0]) {\n  const g = new THREE.Group(); g.position.set(...pos); g.rotation.set(...rot);\n  if (kind) g.userData.kind = kind;\n  parent.add(g);\n  return g;\n}\nfunction piece(geo, material, parent, pos = [0, 0, 0], rot = [0, 0, 0]) {\n  const m = new THREE.Mesh(geo, material); m.position.set(...pos); m.rotation.set(...rot);\n  m.castShadow = m.receiveShadow = true;\n  parent.add(m);\n  return m;\n}\n\n// ── Fox: sculpted single-mesh body, skinned to a rig (fox-model.js) ──\nconst knitBase = tok('--color-accent-2-700', '#56633f'), knitRib = tok('--color-accent-2-800', '#3d472b'), knitStripe = new THREE.Color(0xf9f4ed);\nconst character = buildCharacter({ knit: { base: knitBase, rib: knitRib, stripe: knitStripe }, look: store.get('foxroom.char', null) });\nconst { fox, hat, hatSocket, sweater, outfits, headwear, palette, resetPose, stats } = character;\nlet charLook = character.look();\nconsole.info('fox sculpt', stats);\nconst proxy = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 0.5, 4, 12), new THREE.MeshBasicMaterial());\nproxy.name = 'PickProxy'; proxy.position.y = 0.5; proxy.visible = false; fox.add(proxy);\nfox.userData.kind = 'fox';\nconst headBone = fox.getObjectByName('Head');\n\n// ── Room (5.2 × 3.6 m, open toward the camera) ──\nconst scene = new THREE.Scene();\nscene.background = tok('--color-bg', '#f5ead8');\nconst R = {\n  wall: mat('wall', tok('--color-accent-2-200', '#e1eecc'), 0.95),\n  trim: mat('trim', tok('--color-neutral-100', '#f9f4ed'), 0.8),\n  panel: mat('panel', tok('--color-neutral-200', '#eee7db'), 0.8),\n  inside: mat('inside', tok('--color-neutral-700', '#645c50'), 0.95),\n  edge: mat('edge', tok('--color-neutral-500', '#a19786'), 0.9),\n  wood: mat('wood', tok('--color-accent-700', '#8c491a'), 0.6),\n  dark: mat('darkwood', tok('--color-accent-800', '#643312'), 0.65),\n  clay: mat('clay', tok('--color-accent-600', '#b2622d'), 0.9),\n  terra: mat('terra', tok('--color-accent-500', '#c67139'), 0.95),\n  rugA: mat('rugA', tok('--color-accent-300', '#ffc6a5'), 1),\n  rugB: mat('rugB', tok('--color-neutral-100', '#f9f4ed'), 1),\n  leaf1: mat('leaf1', tok('--color-accent-2-500', '#8fa073'), 0.8),\n  leaf2: mat('leaf2', tok('--color-accent-2-600', '#728157'), 0.8),\n  leaf3: mat('leaf3', tok('--color-accent-2-400', '#aebf92'), 0.8),\n  cushion: mat('cushion', tok('--color-accent-2-500', '#8fa073'), 0.95),\n  pad: mat('pad', tok('--color-accent-2-400', '#aebf92'), 0.95),\n  china: mat('china', tok('--color-neutral-100', '#f9f4ed'), 0.35, { side: THREE.DoubleSide }),\n  tea: mat('tea', tok('--color-accent-800', '#643312'), 0.2),\n  paper: mat('paper', tok('--color-neutral-100', '#f9f4ed'), 0.9),\n  curtain: mat('curtain', tok('--color-accent-300', '#ffc6a5'), 0.95, { side: THREE.DoubleSide }),\n  fold: mat('fold', knitBase, 0.95),\n  foldCream: mat('foldCream', knitStripe, 0.95),\n  snow: mat('snow', 0xffffff, 0.9),\n  glass: new THREE.MeshPhysicalMaterial({ name: 'glass', color: 0xffffff, roughness: 0.05, transparent: true, opacity: 0.1, depthWrite: false }),\n};\nconst WARM = tok('--color-accent-200', '#ffd9bf');\n\nfunction floorTexture() {\n  const c = document.createElement('canvas'); c.width = 1300; c.height = 900;\n  const g = c.getContext('2d');\n  const tones = [cssColor('--color-neutral-200', '#eee7db'), cssColor('--color-neutral-300', '#dcd3c4')];\n  g.fillStyle = cssColor('--color-neutral-400', '#c0b6a5'); g.fillRect(0, 0, c.width, c.height);\n  let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);\n  const rows = 12, rh = c.height / rows;\n  for (let r = 0; r < rows; r++) for (let x = -rnd() * 280; x < c.width;) {\n    const len = 240 + rnd() * 300;\n    g.fillStyle = tones[rnd() < 0.5 ? 0 : 1];\n    g.beginPath(); g.roundRect(x + 2, r * rh + 2, len - 4, rh - 4, 3); g.fill();\n    x += len;\n  }\n  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;\n  return t;\n}\nconst floorG = group(scene, 'floor');\npiece(new THREE.BoxGeometry(5.2, 0.12, 3.6), [R.edge, R.edge, mat('floor', 0xffffff, 0.8, { map: floorTexture() }), R.edge, R.edge, R.edge], floorG, [0, -0.06, 0]);\n\n// Walls, with a real opening for the window\nconst WIN = { x: 0.05, y: 1.3, w: 1.1, h: 0.85 };\nconst wx0 = WIN.x - WIN.w / 2, wx1 = WIN.x + WIN.w / 2, wy0 = WIN.y - WIN.h / 2, wy1 = WIN.y + WIN.h / 2;\nconst walls = group(scene, 'wall');\nconst wallMats = [R.wall, R.wall, R.trim, R.wall, R.wall, R.wall];\nconst wallBox = (x0, x1, y0, y1) => piece(new THREE.BoxGeometry(x1 - x0, y1 - y0, 0.12), wallMats, walls, [(x0 + x1) / 2, (y0 + y1) / 2, -1.86]);\nwallBox(-2.72, wx0, -0.12, 2.1); wallBox(wx1, 2.6, -0.12, 2.1); wallBox(wx0, wx1, -0.12, wy0); wallBox(wx0, wx1, wy1, 2.1);\npiece(new THREE.BoxGeometry(0.12, 2.22, 3.6), wallMats, walls, [-2.66, 0.99, 0]);\npiece(new THREE.BoxGeometry(5.2, 0.09, 0.025), R.trim, walls, [0, 0.045, -1.7875]);\npiece(new THREE.BoxGeometry(0.025, 0.09, 3.6), R.trim, walls, [-2.5875, 0.045, 0]);\n\n// Window: frame, mullions, glass, sill, curtains\nconst win = group(scene, 'window');\nfor (const [w, h, x, y] of [[WIN.w + 0.14, 0.07, WIN.x, wy1 + 0.035], [WIN.w + 0.14, 0.07, WIN.x, wy0 - 0.035], [0.07, WIN.h, wx0 - 0.035, WIN.y], [0.07, WIN.h, wx1 + 0.035, WIN.y]]) {\n  piece(rbox(w, h, 0.05, 0.015), R.trim, win, [x, y, -1.79]);\n}\nfor (const [w, h, x, y, z] of [[0.02, WIN.h, wx0 + 0.01, WIN.y], [0.02, WIN.h, wx1 - 0.01, WIN.y], [WIN.w, 0.02, WIN.x, wy1 - 0.01], [WIN.w, 0.02, WIN.x, wy0 + 0.01]]) {\n  piece(new THREE.BoxGeometry(w, h, 0.12), R.trim, win, [x, y, -1.86]);\n}\npiece(rbox(0.035, WIN.h, 0.04, 0.012), R.trim, win, [WIN.x, WIN.y, -1.88]);\npiece(rbox(WIN.w, 0.035, 0.04, 0.012), R.trim, win, [WIN.x, WIN.y, -1.88]);\nconst glass = new THREE.Mesh(new THREE.PlaneGeometry(WIN.w, WIN.h), R.glass); glass.position.set(WIN.x, WIN.y, -1.885); win.add(glass);\npiece(rbox(WIN.w + 0.26, 0.04, 0.16, 0.018), R.trim, win, [WIN.x, wy0 - 0.08, -1.73]);\nconst snowSill = piece(rbox(WIN.w - 0.04, 0.05, 0.07, 0.024), R.snow, win, [WIN.x, wy0 + 0.02, -1.95]);\nsnowSill.scale.y = 0.0
